
name: Build SUCCESS LADDER APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool libltdl-dev \
            pkg-config build-essential cmake \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev libsqlite3-dev \
            liblzma-dev libbz2-dev libreadline-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel
          python -m pip install cython==0.29.36
          python -m pip install buildozer==1.5.0

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
        timeout-minutes: 75

      - name: Show build error
        if: failure()
        run: |
          if [ -f build.log ]; then
            tail -150 build.log
          fi

      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: مدرسة سلم النجاح
          target_commitish: main
          files: bin/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Upload APK and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SUCCESS-LADDER-BUILD
          path: |
            bin/*.apk
            build.log
          if-no-files-found: warn
          retention-days: 7
