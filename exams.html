<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1533">
<title>قمة - الامتحانات</title>
<style>
:root{--bg:#0b1533;--card:#15244f;--card2:#1c2f66;--gold:#f5b942;--mut:#9fb0d9;--ok:#2ecc71;--bad:#e5484d;--blue:#4da3ff}
*{box-sizing:border-box;margin:0;font-family:Tahoma,Arial,sans-serif}
body{background:var(--bg);color:#fff;padding-bottom:30px}
header{padding:14px;background:linear-gradient(135deg,#1c2f66,#0b1533);border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:10px}
header h1{color:var(--gold);font-size:20px;flex:1}
header a,header button{background:var(--card2);color:#fff;border:none;border-radius:10px;padding:8px 12px;font-size:13px;text-decoration:none;cursor:pointer}
main{padding:14px;max-width:560px;margin:auto}
h2{font-size:16px;color:var(--gold);margin:4px 0 10px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
input,select{width:100%;padding:11px;margin:5px 0;border-radius:10px;border:none;font-size:15px;background:#fff;color:#000;font-family:inherit}
button.b{width:100%;padding:11px;margin-top:5px;border-radius:10px;border:none;font-size:15px;background:var(--gold);color:#000;font-weight:bold;cursor:pointer}
.s2{background:var(--card2)!important;color:#fff!important}
.ok{background:var(--ok)!important}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #2c3f7a;gap:8px}
.row:last-child{border:none}
.row small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.sm{border:none;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;font-weight:bold}
.g{background:var(--ok);color:#000}.r{background:var(--bad);color:#fff}.y{background:var(--gold);color:#000}
.mut{color:var(--mut);font-size:13px}
.err{color:#ff8a8a;font-size:13px;margin-top:6px}
.q{background:var(--card2);border-radius:12px;padding:12px;margin:8px 0}
.opt{display:block;background:#fff;color:#000;border-radius:10px;padding:10px;margin:5px 0;font-size:14px;cursor:pointer}
.opt.sel{outline:3px solid var(--gold)}
.tm{position:sticky;top:0;background:var(--bad);text-align:center;padding:6px;border-radius:10px;font-weight:bold;z-index:5;margin-bottom:8px}
.cred{background:#fff;color:#000;border-radius:10px;padding:10px;margin-top:8px;white-space:pre-wrap;font-size:14px;line-height:1.8}
.hide{display:none}
.badge{background:var(--card2);color:var(--gold);padding:3px 10px;border-radius:20px;font-size:12px;font-weight:bold}
</style>
</head>
<body>
<header>
  <div style="font-size:28px">🏔️</div><h1>قمة - الامتحانات</h1>
  <a href="index.html">الرئيسية</a>
  <button id="outbtn" class="hide" onclick="doLogout()">خروج</button>
</header>
<main>

<div id="login" class="card hide">
  <h2>🔐 تسجيل الدخول</h2>
  <input id="u" placeholder="رقم القيد (أو البريد الإلكتروني)" autocapitalize="off" autocomplete="username">
  <input id="p" type="password" placeholder="الرمز السري" autocomplete="current-password">
  <button class="b" onclick="doLogin()">دخول</button>
  <div id="lerr" class="err"></div>
  <div class="mut" style="margin-top:8px">الطالب: رقم القيد + الرمز الذي أعطته الإدارة. وإن تعذّر ذلك فيمكنه الدخول ببريده الإلكتروني إن كان مسجلًا به.</div>
</div>

<div id="teacher" class="hide">
  <div class="card">
    <h2>➕ إضافة طالب</h2>
    <input id="sn" placeholder="اسم الطالب">
    <input id="sc" placeholder="الصف (مثال: التاسع)">
    <input id="si" placeholder="رقم القيد (أحرف إنجليزية وأرقام)" autocapitalize="off">
    <input id="se" placeholder="بريد إلكتروني (اختياري، بدل رقم القيد)" autocapitalize="off">
    <button class="b" onclick="addStudent()">إنشاء حساب الطالب</button>
    <div id="newcred"></div>
  </div>

  <div class="card">
    <h2>🧪 إنشاء امتحان</h2>
    <input id="et" placeholder="عنوان الامتحان">
    <input id="ec" placeholder="الصف المستهدف (اتركه فارغًا لكل الصفوف)">
    <input id="emin" type="number" min="1" placeholder="المدة بالدقائق">
    <hr style="margin:10px 0;opacity:.2">
    <input id="eq" placeholder="نص السؤال">
    <input id="ea0" placeholder="الخيار 1"><input id="ea1" placeholder="الخيار 2">
    <input id="ea2" placeholder="الخيار 3 (اختياري)"><input id="ea3" placeholder="الخيار 4 (اختياري)">
    <select id="eok"><option value="0">الإجابة الصحيحة: 1</option><option value="1">الإجابة الصحيحة: 2</option><option value="2">الإجابة الصحيحة: 3</option><option value="3">الإجابة الصحيحة: 4</option></select>
    <button class="b s2" onclick="addQ()">➕ إضافة السؤال</button>
    <div id="qdraft" class="mut" style="margin-top:6px"></div>
    <button class="b ok" onclick="saveExam()">📤 نشر الامتحان للطلاب</button>
  </div>

  <div class="card"><h2>📋 الامتحانات</h2><div id="tex"></div></div>
  <div class="card hide" id="resbox"><h2>🏅 النتائج</h2><div id="tres"></div></div>
  <div class="card"><h2>🎓 الطلاب</h2><div id="tst"></div></div>
</div>

<div id="student" class="hide">
  <div class="card"><h2 id="hello"></h2><div id="sex"></div></div>
</div>

<div id="taking" class="hide">
  <div class="card">
    <div class="tm" id="timer"></div>
    <h2 id="xt"></h2>
    <div id="xbody"></div>
    <button class="b ok" onclick="submitExam()">✅ تسليم الامتحان</button>
  </div>
</div>

</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getDatabase,ref,get,set,push,remove} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const cfg={
  apiKey:"AIzaSyB_91tHmhP6ijWKXSSkIQbJwoFYMBqXAG4",
  authDomain:"salam-alnajah.firebaseapp.com",
  databaseURL:"https://salam-alnajah-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"salam-alnajah",
  storageBucket:"salam-alnajah.firebasestorage.app",
  messagingSenderId:"893705845323",
  appId:"1:893705845323:web:c82c332c1d5fb78b64abce"
};
const app=initializeApp(cfg),auth=getAuth(app),db=getDatabase(app);
const app2=initializeApp(cfg,"second");
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SIGN='قمة - مدرسة سلم النجاح';
const toMail=u=>u.includes('@')?u:u.toLowerCase()+'@qimma.school';
const VIEWS=['login','teacher','student','taking'];
function view(n){VIEWS.forEach(v=>$(v).classList.toggle('hide',v!==n));$('outbtn').classList.toggle('hide',n==='login')}

let me=null,profile=null,examsCache={},cur=null,ans=[],tInt=null,draft=[];

window.doLogin=async()=>{
  $('lerr').textContent='';
  const u=$('u').value.trim(),p=$('p').value;
  if(!u||!p){$('lerr').textContent='أدخل رقم القيد والرمز';return}
  try{await signInWithEmailAndPassword(auth,toMail(u),p)}
  catch(e){$('lerr').textContent='رقم القيد أو الرمز غير صحيح، أو جرّب الدخول بالبريد الإلكتروني'}
};
window.doLogout=()=>{clearInterval(tInt);signOut(auth)};

onAuthStateChanged(auth,async user=>{
  me=user;
  if(!user){view('login');return}
  try{
    const t=await get(ref(db,'teachers/'+user.uid));
    if(t.exists()){view('teacher');loadT();return}
    const s=await get(ref(db,'students/'+user.uid));
    profile=s.val()||{};
    view('student');loadS();
  }catch(e){alert('تعذر تحميل البيانات: '+e.code)}
});

window.addStudent=async()=>{
  const n=$('sn').value.trim(),c=$('sc').value.trim(),id=$('si').value.trim(),em=$('se').value.trim();
  if(!n||(!id&&!em))return alert('أدخل اسم الطالب ورقم القيد (أو بريدًا)');
  if(id&&!/^[A-Za-z0-9]+$/.test(id))return alert('رقم القيد: أحرف إنجليزية وأرقام فقط، بدون مسافات');
  const pass=String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000);
  const mail=em||toMail(id);
  try{
    const a2=getAuth(app2);
    const cr=await createUserWithEmailAndPassword(a2,mail,pass);
    await signOut(a2);
    await set(ref(db,'students/'+cr.user.uid),{n:n,c:c,id:em||id});
    const txt=`بيانات دخول الطالب ${n}\nرقم القيد: ${em||id}\nالرمز السري: ${pass}\nحمّلوا التطبيق وادخلوا من قسم الامتحانات.\n${SIGN}`;
    $('newcred').innerHTML=`<div class="cred">${esc(txt)}</div><button class="b" style="background:#25d366" onclick="window.open('https://wa.me/?text='+encodeURIComponent(this.dataset.t),'_blank')" data-t="${esc(txt)}">📲 إرسال بالواتساب</button><div class="mut" style="margin-top:6px">احفظ الرمز الآن، فلن يظهر مرة ثانية.</div>`;
    ['sn','sc','si','se'].forEach(i=>$(i).value='');
    loadT();
  }catch(e){
    alert(e.code==='auth/email-already-in-use'?'رقم القيد مستخدم من قبل':'تعذر الإنشاء: '+e.code);
  }
};

window.addQ=()=>{
  const q=$('eq').value.trim(),k=Number($('eok').value);
  const real=[0,1,2,3].map(i=>$('ea'+i).value.trim());
  if(!q||real.filter(x=>x).length<2)return alert('اكتب السؤال وخيارين على الأقل');
  if(!real[k])return alert('الإجابة الصحيحة تشير لخيار فارغ');
  const o=[],map={};
  real.forEach((x,i)=>{if(x){map[i]=o.length;o.push(x)}});
  draft.push({q:q,o:o,k:map[k]});
  ['eq','ea0','ea1','ea2','ea3'].forEach(i=>$(i).value='');
  $('qdraft').textContent='عدد الأسئلة المضافة: '+draft.length;
};

window.saveExam=async()=>{
  const t=$('et').value.trim();
  if(!t||!draft.length)return alert('أدخل العنوان وسؤالًا واحدًا على الأقل');
  try{
    const r=push(ref(db,'exams'));
    await set(ref(db,'answers/'+r.key),draft.map(x=>x.k));
    await set(r,{t:t,c:$('ec').value.trim(),min:Number($('emin').value)||10,q:draft.map(x=>({q:x.q,o:x.o})),time:Date.now()});
    draft=[];['et','ec','emin'].forEach(i=>$(i).value='');$('qdraft').textContent='';
    alert('تم نشر الامتحان للطلاب');loadT();
  }catch(e){alert('تعذر النشر: '+e.code)}
};

async function loadT(){
  const [ex,st]=await Promise.all([get(ref(db,'exams')),get(ref(db,'students'))]);
  const exams=ex.val()||{},studs=st.val()||{};
  $('tex').innerHTML=Object.keys(exams).map(id=>{const e=exams[id];
    return `<div class="row"><span>${esc(e.t)}<small>${esc(e.c||'كل الصفوف')} - ${(e.q||[]).length} أسئلة - ${e.min} دقيقة</small></span><span><button class="sm y" onclick="grade('${id}')">تصحيح/نتائج</button> <button class="sm r" onclick="delExam('${id}')">✕</button></span></div>`}).join('')||'<div class="mut">لا توجد امتحانات</div>';
  $('tst').innerHTML=Object.values(studs).map(s=>`<div class="row"><span>${esc(s.n)}<small>${esc(s.c||'')} - ${esc(s.id)}</small></span></div>`).join('')||'<div class="mut">لا يوجد طلاب بعد</div>';
}

window.delExam=async id=>{
  if(!confirm('حذف الامتحان وكل إجاباته ونتائجه؟'))return;
  await Promise.all(['exams','answers','submissions','results'].map(k=>remove(ref(db,k+'/'+id))));
  $('resbox').classList.add('hide');loadT();
};

window.grade=async eid=>{
  try{
    const [key,subs,sts]=await Promise.all([get(ref(db,'answers/'+eid)),get(ref(db,'submissions/'+eid)),get(ref(db,'students'))]);
    const k=key.val()||[],s=subs.val()||{},st=sts.val()||{},tot=k.length;
    const rows=[];
    for(const uid in s){
      const a=s[uid].a||[];let sc=0;
      k.forEach((x,i)=>{if(a[i]===x)sc++});
      const pct=tot?Math.round(sc/tot*100):0,n=(st[uid]||{}).n||uid;
      await set(ref(db,`results/${eid}/${uid}`),{n:n,sc:sc,tot:tot,pct:pct});
      rows.push({n:n,sc:sc,tot:tot,pct:pct});
    }
    rows.sort((a,b)=>b.sc-a.sc);
    const avg=rows.length?(rows.reduce((x,r)=>x+r.pct,0)/rows.length).toFixed(1):0;
    $('tres').innerHTML=`<div class="mut">عدد المسلّمين: ${rows.length} - المتوسط: ${avg}%</div>`+
      (rows.map((r,i)=>`<div class="row"><span>${i+1}. ${esc(r.n)}</span><span class="badge">${r.sc}/${r.tot} (${r.pct}%)</span></div>`).join('')||'<div class="mut">لم يسلّم أحد بعد</div>');
    $('resbox').classList.remove('hide');$('resbox').scrollIntoView();
  }catch(e){alert('تعذر التصحيح: '+e.code)}
};

async function loadS(){
  $('hello').textContent='أهلًا '+(profile.n||'');
  const ex=(await get(ref(db,'exams'))).val()||{};
  examsCache=ex;
  const items=[];
  for(const id in ex){
    const e=ex[id];
    if(e.c&&profile.c&&e.c!==profile.c)continue;
    const sub=await get(ref(db,`submissions/${id}/${me.uid}`));
    const res=await get(ref(db,`results/${id}/${me.uid}`));
    items.push({id,e,done:sub.exists(),res:res.val()});
  }
  $('sex').innerHTML=items.map(x=>{
    let act;
    if(x.res)act=`<span class="badge">${x.res.sc}/${x.res.tot} (${x.res.pct}%)</span>`;
    else if(x.done)act=`<span class="badge">سُلّم - بانتظار التصحيح</span>`;
    else act=`<button class="sm g" onclick="startExam('${x.id}')">بدء</button>`;
    return `<div class="row"><span>${esc(x.e.t)}<small>${(x.e.q||[]).length} أسئلة - ${x.e.min} دقيقة</small></span>${act}</div>`;
  }).join('')||'<div class="mut">لا توجد امتحانات متاحة لك الآن</div>';
}

window.startExam=id=>{
  cur=id;const e=examsCache[id];
  if(!confirm('عند البدء يبدأ المؤقت ولا يمكن إعادة الامتحان. هل أنت جاهز؟'))return;
  ans=(e.q||[]).map(()=>-1);
  $('xt').textContent=e.t;
  $('xbody').innerHTML=e.q.map((q,qi)=>`<div class="q"><b>${qi+1}. ${esc(q.q)}</b>`+q.o.map((o,oi)=>`<label class="opt" id="o${qi}_${oi}" onclick="pick(${qi},${oi})">${esc(o)}</label>`).join('')+`</div>`).join('');
  let left=e.min*60;clearInterval(tInt);
  const tick=()=>{const m=Math.floor(left/60),s=left%60;$('timer').textContent='⏱ '+m+':'+String(s).padStart(2,'0');if(left--<=0){clearInterval(tInt);submitExam(true)}};
  tick();tInt=setInterval(tick,1000);
  view('taking');window.scrollTo(0,0);
};

window.pick=(q,o)=>{ans[q]=o;examsCache[cur].q[q].o.forEach((_,i)=>$('o'+q+'_'+i).classList.toggle('sel',i===o))};

window.submitExam=async auto=>{
  if(!cur)return;
  if(auto!==true&&ans.includes(-1)&&!confirm('بعض الأسئلة بلا إجابة. تسليم؟'))return;
  clearInterval(tInt);
  try{
    await set(ref(db,`submissions/${cur}/${me.uid}`),{a:ans,t:Date.now()});
    alert('تم تسليم الامتحان. ستظهر درجتك بعد أن يصحّحه المعلم.');
  }catch(e){alert('تعذر التسليم (ربما سُلّم من قبل): '+e.code)}
  cur=null;view('student');loadS();
};
</script>
</body>
</html>
